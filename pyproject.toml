[project]
name = "quantum-community-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TiagoRodriguesskt", email = "tiagorodriguesskt@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
